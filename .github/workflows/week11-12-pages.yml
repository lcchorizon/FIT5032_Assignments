name: Deploy Week 11 and 12 library to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['Week11_12/**', '.github/workflows/week11-12-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week11_12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Week11_12/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test weather search
        run: npm test
      - name: Build for repository path
        run: npm run build
        env:
          DEPLOY_BASE: /FIT5032_Assignments/
      - name: Add history route fallback
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Week11_12/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
